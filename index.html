<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iPhone 库存监控 · 京津门店取货</title>
<style>
  /* 让渐变颜色可动画（切换机型时背景 1 秒平滑过渡） */
  @property --bg { syntax: '<color>'; inherits: true; initial-value: #0b0d12; }
  @property --glow { syntax: '<color>'; inherits: true; initial-value: #16203a; }
  :root {
    --bg: #0b0d12; --glow: #16203a; --panel: #141824; --panel2: #1a2030; --line: #262d40;
    --txt: #e8ecf5; --dim: #8b94ab; --accent: #4f8cff;
    --ok: #23c26b; --ok-bg: rgba(35,194,107,.12);
    --bad: #ff5a6a; --bad-bg: rgba(255,90,106,.10);
    --warn: #ffb02e;
    transition: --bg 1s, --glow 1s;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(1200px 600px at 20% -10%, var(--glow) 0%, var(--bg) 55%);
    color: var(--txt); font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh; padding: 24px 18px 60px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  header { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px; margin-bottom: 18px; }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: .5px; }
  h1 .sub { display: block; font-size: 13px; color: var(--dim); font-weight: 400; margin-top: 6px; }
  .spacer { flex: 1; }
  .pill {
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 14px; font-size: 13px; color: var(--dim); display: flex; align-items: center; gap: 8px;
  }
  .pill b { color: var(--txt); font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .dot.pulse { animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0 22px; }
  button, .btn {
    background: var(--panel2); color: var(--txt); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 16px; font-size: 13px; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center; gap: 7px;
    transition: .15s;
  }
  button:hover, .btn:hover { border-color: var(--accent); transform: translateY(-1px); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.on { background: var(--ok); border-color: var(--ok); color: #06220f; font-weight: 600; }
  select {
    background: var(--panel2); color: var(--txt); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 12px; font-size: 13px;
  }

  .banner {
    display: none; border-radius: 14px; padding: 18px 20px; margin-bottom: 18px;
    background: var(--ok-bg); border: 1px solid var(--ok); font-size: 16px; font-weight: 600;
  }
  .banner.show { display: block; animation: flash 1s infinite; }
  @keyframes flash { 0%,100% { background: var(--ok-bg) } 50% { background: rgba(35,194,107,.28) } }
  .banner a { color: var(--ok); margin-left: 10px; }

  .city-title { font-size: 14px; color: var(--dim); margin: 22px 0 12px; letter-spacing: 2px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; position: relative; overflow: hidden;
  }
  .card.ok { border-color: var(--ok); background: linear-gradient(180deg, var(--ok-bg), var(--panel)); }
  .card.bad { opacity: .82; }
  .card .name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .card .id { font-size: 11px; color: var(--dim); margin-bottom: 12px; }
  .badge {
    display: inline-block; border-radius: 999px; padding: 4px 11px;
    font-size: 12px; font-weight: 600; margin-bottom: 10px;
  }
  .badge.ok { background: var(--ok); color: #06220f; }
  .badge.bad { background: var(--bad-bg); color: var(--bad); border: 1px solid rgba(255,90,106,.35); }
  .badge.unknown { background: #2a3145; color: var(--dim); }
  .card .quote { font-size: 12px; color: var(--dim); line-height: 1.6; min-height: 36px; }
  .card .btn { margin-top: 12px; font-size: 12px; padding: 7px 12px; }
  .card.ok .btn { background: var(--ok); border-color: var(--ok); color: #06220f; font-weight: 600; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin-top: 26px; }
  .panel h2 { font-size: 14px; color: var(--dim); letter-spacing: 2px; margin-bottom: 12px; }
  #log { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; line-height: 1.9; max-height: 300px; overflow-y: auto; }
  #log .t { color: var(--dim); margin-right: 10px; }
  #log .up { color: var(--ok); } #log .down { color: var(--bad); } #log .info { color: var(--dim); } #log .err { color: var(--warn); }
  .foot { margin-top: 18px; font-size: 11px; color: var(--dim); line-height: 1.8; }
  .errbar { display: none; background: #3a2410; border: 1px solid var(--warn); color: var(--warn);
    border-radius: 10px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; }
  .errbar.show { display: block; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="pageTitle">📱 iPhone 库存监控
      <span class="sub">天津 3 家 + 北京 6 家 Apple Store 零售店 · 实时库存 · 自动刷新</span>
    </h1>
    <div class="spacer"></div>
    <div class="pill"><span class="dot pulse" id="liveDot"></span> 刷新间隔 <b id="intervalTxt">3 秒</b></div>
    <div class="pill">上次更新 <b id="lastUpdate">--:--:--</b></div>
    <div class="pill">响应 <b id="latency">-</b></div>
    <div class="pill">累计刷新 <b id="refreshCount">0</b></div>
  </header>

  <div class="errbar" id="errBar"></div>
  <div class="banner" id="banner">🚨 检测到门店现货！<a href="https://www.apple.com.cn/shop/buy-iphone/iphone-duo" target="_blank">立即去下单 →</a></div>

  <div class="toolbar">
    <select id="modelSel" title="选择监控机型"></select>
    <button class="primary" id="btnManual">🔄 立即刷新</button>
    <button id="btnSound">🔔 开启声音提醒</button>
    <button id="btnNotify">🔔 开启系统通知</button>
    <select id="intervalSel">
      <option value="3000" selected>刷新间隔：3 秒</option>
      <option value="5000">5 秒</option>
      <option value="10000">10 秒</option>
      <option value="30000">30 秒</option>
    </select>
    <a class="btn" id="buyLink" href="https://www.apple.com.cn/shop/buy-iphone/iphone-duo" target="_blank">🛒 苹果官网购买页</a>
    <button id="btnKey">🔑 访问密钥</button>
    <button id="btnCopy">📋 复制物料号</button>
    <button id="btnClear">🧹 清空记录</button>
  </div>

  <div class="city-title">TIANJIN · 天津（3 家）</div>
  <div class="grid" id="gridTJ"></div>
  <div class="city-title">BEIJING · 北京（6 家）</div>
  <div class="grid" id="gridBJ"></div>

  <div class="panel">
    <h2>变化记录 / EVENT LOG</h2>
    <div id="log"></div>
  </div>

  <div class="foot" id="footInfo">
    数据来源：Apple 官网零售店取货接口（pickup-message）<br>
    说明：本页经服务端代理查询苹果接口，自动刷新；如遇“接口异常”多为访问频率触发风控，页面会自动恢复。请勿将此页面公开部署或并发多人使用。
  </div>
</div>

<script>
const API = '/api/stock';
const BUY_URLS = [
  ['Duo', 'https://www.apple.com.cn/shop/buy-iphone/iphone-duo'],
  ['Pro Max', 'https://www.apple.com.cn/shop/buy-iphone/iphone-18-pro'],
  ['Pro', 'https://www.apple.com.cn/shop/buy-iphone/iphone-18-pro'],
];
const buyUrlFor = name => (BUY_URLS.find(([k]) => name.includes(k)) || [])[1] || 'https://www.apple.com.cn/shop/buy-iphone';
let ACCESS_KEY = localStorage.getItem('duo_access_key') || '';
let TEMP_TOKEN = localStorage.getItem('duo_temp_token') || '';
let TEMP_EXPIRY = +(localStorage.getItem('duo_temp_expiry') || 0);
let modelIdx = +(localStorage.getItem('duo_model_idx') || 0);
let modelList = [];
// API 调用用的密钥：优先用主密钥，否则用未过期的临时 token
function effectiveKey() {
  if (ACCESS_KEY && ACCESS_KEY !== 'free') return ACCESS_KEY;
  if (TEMP_TOKEN && Date.now() < TEMP_EXPIRY) return TEMP_TOKEN;
  return '';
}
const apiURL = () => {
  const k = effectiveKey();
  return API + '?_=' + Date.now() + (k ? '&key=' + encodeURIComponent(k) : '');
};
function isTempKeyActive() { return !!(TEMP_TOKEN && Date.now() < TEMP_EXPIRY); }
async function promptKey() {
  const v = prompt('请输入访问密钥（主密钥永久有效；输入 free 获取 1 小时临时访问）：', ACCESS_KEY || '');
  if (v === null) return;
  const input = v.trim();
  if (input === 'free') {
    // 用临时密钥换取 1 小时会话 token
    try {
      const r = await fetch('/api/temp-key?key=free&_=' + Date.now());
      const d = await r.json();
      if (d.ok && d.token) {
        TEMP_TOKEN = d.token;
        TEMP_EXPIRY = d.expiresAt;
        localStorage.setItem('duo_temp_token', TEMP_TOKEN);
        localStorage.setItem('duo_temp_expiry', String(TEMP_EXPIRY));
        ACCESS_KEY = '';
        localStorage.removeItem('duo_access_key');
        const mins = Math.round((TEMP_EXPIRY - Date.now()) / 60000);
        log(`临时访问已激活，有效期 ${mins} 分钟（到期需重新输入 free）`);
        updateKeyButton();
        poll();
      } else {
        alert('临时密钥换取失败：' + (d.error || '未知错误'));
      }
    } catch (e) {
      alert('临时密钥换取失败：' + e.message);
    }
    return;
  }
  // 主密钥或清空
  ACCESS_KEY = input;
  TEMP_TOKEN = '';
  TEMP_EXPIRY = 0;
  localStorage.removeItem('duo_temp_token');
  localStorage.removeItem('duo_temp_expiry');
  if (ACCESS_KEY) localStorage.setItem('duo_access_key', ACCESS_KEY);
  else localStorage.removeItem('duo_access_key');
  log(ACCESS_KEY ? '访问密钥已保存' : '访问密钥已清空');
  updateKeyButton();
  poll();
}
function updateKeyButton() {
  const btn = $('btnKey');
  if (!btn) return;
  if (isTempKeyActive()) {
    const mins = Math.max(1, Math.round((TEMP_EXPIRY - Date.now()) / 60000));
    btn.textContent = `⏳ 临时访问（剩 ${mins} 分钟）`;
    btn.classList.add('on');
  } else {
    // 过期的临时 token 自动清理
    if (TEMP_TOKEN) {
      TEMP_TOKEN = ''; TEMP_EXPIRY = 0;
      localStorage.removeItem('duo_temp_token');
      localStorage.removeItem('duo_temp_expiry');
    }
    btn.textContent = ACCESS_KEY ? '🔑 更换密钥' : '🔑 访问密钥';
    btn.classList.toggle('on', !!ACCESS_KEY);
  }
}
// 每分钟检查临时 token 是否过期
setInterval(() => {
  if (TEMP_TOKEN && Date.now() >= TEMP_EXPIRY) {
    log('临时访问已过期，请重新输入 free 获取', 'err');
    updateKeyButton();
    poll();
  } else if (isTempKeyActive()) {
    updateKeyButton();
  }
}, 60000);
let intervalMs = 3000, timer = null, busy = false, count = 0;
let prevState = {};      // storeNumber -> available
let soundOn = false, audioCtx = null, beepTimer = null, titleTimer = null;

const $ = id => document.getElementById(id);

function nowStr() { return new Date().toLocaleTimeString('zh-CN', {hour12: false}); }

function log(msg, cls = 'info') {
  const el = document.createElement('div');
  el.innerHTML = `<span class="t">${nowStr()}</span><span class="${cls}">${msg}</span>`;
  const box = $('log');
  box.prepend(el);
  while (box.children.length > 200) box.removeChild(box.lastChild);
}

function card(s, buyUrl) {
  const ok = s.available;
  const badge = ok ? '<span class="badge ok">🟢 现货可取货</span>'
                   : (s.pickupDisplay === 'unknown' ? '<span class="badge unknown">状态未知</span>'
                                                    : '<span class="badge bad">⚪ 暂无供应</span>');
  return `<div class="card ${ok ? 'ok' : 'bad'}">
    <div class="name">Apple ${s.storeName}</div>
    <div class="id">${s.city} · 门店号 ${s.storeNumber}</div>
    ${badge}
    <div class="quote">${s.quote || (ok ? '现在可以取货' : '目前无货')}</div>
    <a class="btn" href="${s.reservationUrl || buyUrl}" target="_blank">${ok ? '⚡ 立即预约取货' : '查看 / 下单'}</a>
  </div>`;
}

function curModel(d) {
  if (d.models && d.models.length) {
    if (modelIdx >= d.models.length) modelIdx = 0;
    return d.models[modelIdx];
  }
  // 兼容老格式
  return { part: d.part, name: d.product, price: d.price, anyAvailable: d.anyAvailable, stores: d.stores || [] };
}

/* 按 iPhone 颜色切换页面主题：深色/浅色自动适配，找不到精确颜色时用相近色 */
const COLOR_THEMES = [
  { keys: ['星光白'], bg: '#f1eee8', glow: '#ffffff', panel: '#ffffff', panel2: '#f6f4ee', line: '#e0dccf', txt: '#1d1d1f', dim: '#6e6e73' },
  { keys: ['银色'], bg: '#e9e9ed', glow: '#f5f5f7', panel: '#ffffff', panel2: '#f4f4f6', line: '#d8d8de', txt: '#1d1d1f', dim: '#6e6e73' },
  { keys: ['冰川蓝'], bg: '#e4edf3', glow: '#d2e4ef', panel: '#ffffff', panel2: '#eef5f9', line: '#cfdde8', txt: '#1c2a33', dim: '#66788a' },
  { keys: ['夜空黑'], bg: '#0a0a0d', glow: '#1d1d24', panel: '#131316', panel2: '#1c1c21', line: '#2a2a32', txt: '#e8ecf5', dim: '#8b94ab' },
  { keys: ['黑色'], bg: '#0b0d12', glow: '#16203a', panel: '#141824', panel2: '#1a2030', line: '#262d40', txt: '#e8ecf5', dim: '#8b94ab' },
  { keys: ['酒红'], bg: '#150b0d', glow: '#3d1620', panel: '#1f1216', panel2: '#2b1a20', line: '#3d2530', txt: '#f5e9ec', dim: '#a98b94' },
];
const DEFAULT_THEME = COLOR_THEMES[4];

function applyTheme(modelName) {
  const t = COLOR_THEMES.find(x => x.keys.some(k => modelName.includes(k))) || DEFAULT_THEME;
  const root = document.documentElement.style;
  root.setProperty('--bg', t.bg);
  root.setProperty('--glow', t.glow);
  root.setProperty('--panel', t.panel);
  root.setProperty('--panel2', t.panel2);
  root.setProperty('--line', t.line);
  root.setProperty('--txt', t.txt);
  root.setProperty('--dim', t.dim);
}

function syncModelUI(d) {
  const models = d.models || [];
  if (models.length && !modelList.length) {
    modelList = models;
    $('modelSel').innerHTML = models.map((m, i) =>
      `<option value="${i}">${m.name} ¥${m.price.toLocaleString()}</option>`).join('');
  }
  if (modelList.length) {
    $('modelSel').value = String(modelIdx);
    const m = curModel(d);
    const buyUrl = buyUrlFor(m.name);
    applyTheme(m.name);
    const titleNode = $('pageTitle').childNodes[0];
    if (titleNode) titleNode.textContent = '📱 ' + m.name + ' · 门店取货监控 ';
    $('buyLink').href = buyUrl;
    $('btnCopy').textContent = '📋 复制物料号 ' + m.part;
    $('footInfo').innerHTML =
      `产品：<b>${m.name}</b> · 物料号 <b>${m.part}</b> · 官方价 ¥${m.price.toLocaleString()} · 数据来源：Apple 官网零售店取货接口（pickup-message）<br>` +
      `说明：本页经服务端代理查询苹果接口，自动刷新；如遇“接口异常”多为访问频率触发风控，页面会自动恢复。请勿将此页面公开部署或并发多人使用。`;
    document.title = m.name + ' · 京津门店库存监控';
  }
}

function render(d) {
  if (!d.ok) {
    $('errBar').textContent = '⚠️ ' + (d.error || '查询失败') + '（下一轮自动重试）';
    $('errBar').classList.add('show');
    log(d.error || '查询失败', 'err');
    return;
  }
  $('errBar').classList.remove('show');
  syncModelUI(d);
  const m = curModel(d);
  const buyUrl = buyUrlFor(m.name);
  const stores = m.stores || [];
  const tj = stores.filter(s => s.city === '天津');
  const bj = stores.filter(s => s.city !== '天津');
  $('gridTJ').innerHTML = tj.map(s => card(s, buyUrl)).join('');
  $('gridBJ').innerHTML = bj.map(s => card(s, buyUrl)).join('');

  $('lastUpdate').textContent = nowStr();
  $('latency').textContent = (d.latencyMs ?? '-') + ' ms';
  $('refreshCount').textContent = ++count;

  let changed = 0;
  stores.forEach(s => {
    const key = m.part + ':' + s.storeNumber;
    const was = prevState[key];
    if (was !== undefined && was !== s.available) {
      changed++;
      log(`【${m.name}】【${s.city}】Apple ${s.storeName} 状态变化 → ${s.available ? '🟢 有货' : '⚪ 无货'}（${s.quote}）`,
          s.available ? 'up' : 'down');
    } else if (was === undefined) {
      log(`【${m.name}】【${s.city}】Apple ${s.storeName} ${s.available ? '🟢 有货' : '⚪ ' + (s.quote || '暂无供应')}`, 'info');
    }
    prevState[key] = s.available;
  });

  const any = m.anyAvailable;
  $('banner').classList.toggle('show', any);
  $('banner').innerHTML = `🚨 ${m.name} 检测到门店现货！<a href="${buyUrl}" target="_blank">立即去下单 →</a>`;
  if (any) {
    startAlert(m);
  } else {
    stopAlert(m);
  }
  if (changed > 0 && any) $('liveDot').style.background = 'var(--ok)';
}

function startAlert(m) {
  try {
    if (soundOn && !beepTimer) { playRingtone(); beepTimer = setTimeout(() => { beepTimer = null; }, 3000); }
  } catch (e) { console.warn('铃声提醒失败:', e.message); }
  try {
    if (!titleTimer) titleTimer = setInterval(() => {
      document.title = document.title.startsWith('🚨') ? '  ' + m.name + ' 库存监控' : '🚨 有货！' + m.name + ' 库存监控';
    }, 800);
  } catch (e) { console.warn('标题闪烁失败:', e.message); }
  try {
    if ('Notification' in window && Notification.permission === 'granted' && !window.__notified) {
      new Notification(`🚨 ${m.name}有货了！`, { body: '天津/北京 Apple Store 检测到现货，快去下单！', tag: 'duo-stock' });
      window.__notified = true;
      setTimeout(() => window.__notified = false, 60000);
    }
  } catch (e) { console.warn('系统通知失败:', e.message); }
}
function stopAlert(m) {
  if (beepTimer) { clearTimeout(beepTimer); beepTimer = null; }
  if (titleTimer) { clearInterval(titleTimer); titleTimer = null; document.title = (m ? m.name : 'iPhone') + ' · 京津门店库存监控'; }
}

/* iPhone 来电铃声风格：Web Audio 合成，播放 3 秒 */
function playRingtone() {
  try {
    if (!audioCtx) return;
    // AudioContext 可能被浏览器挂起，尝试恢复
    if (audioCtx.state === 'suspended') { audioCtx.resume().catch(() => {}); }
    const t0 = audioCtx.currentTime;
    // Marimba 风格的音符序列（E5 D5 C5 D5 E5 E5 E5 D5 D5）
    const notes = [
      [0.00, 659.25, 0.28], [0.30, 587.33, 0.28], [0.60, 523.25, 0.28],
      [0.90, 587.33, 0.28], [1.20, 659.25, 0.28], [1.50, 659.25, 0.28],
      [1.80, 659.25, 0.55], [2.40, 587.33, 0.28], [2.70, 523.25, 0.30],
    ];
    notes.forEach(([dt, freq, dur]) => {
      const t = t0 + dt;
      const o = audioCtx.createOscillator();
      const o2 = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      const g2 = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = freq;
      o2.type = 'sine'; o2.frequency.value = freq * 4;  // 泛音，模拟马林巴音色
      g2.gain.value = 0.12;
      o.connect(g); o2.connect(g2); g2.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.001, t);
      g.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.start(t); o.stop(t + dur + 0.05);
      o2.start(t); o2.stop(t + dur + 0.05);
    });
  } catch (e) {
    // 音频播放失败不影响主流程，只记录
    console.warn('铃声播放失败:', e.message);
  }
}

function beep() {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.type = 'sine'; o.frequency.value = 880;
  g.gain.setValueAtTime(0.001, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
  o.start(); o.stop(audioCtx.currentTime + 0.4);
}

async function poll() {
  if (busy) return;
  busy = true;
  $('liveDot').style.background = 'var(--accent)';
  const t0 = performance.now();
  let d;
  try {
    const r = await fetch(apiURL());
    if (r.status === 401) {
      $('errBar').textContent = '🔒 需要访问密钥才能查看（点右上角"🔑 访问密钥"填写）';
      $('errBar').classList.add('show');
      promptKey();
      return;
    }
    d = await r.json();
    d.latencyMs = Math.round(performance.now() - t0);
  } catch (e) {
    // 网络/请求失败
    $('errBar').textContent = '⚠️ 服务连接失败：' + e.message + '（下一轮自动重试）';
    $('errBar').classList.add('show');
    log('请求失败: ' + e.message, 'err');
    return;
  } finally {
    busy = false;
  }
  try {
    render(d);
    $('liveDot').style.background = d.anyAvailable ? 'var(--ok)' : 'var(--ok)';
  } catch (e) {
    // 页面渲染失败（与网络无关）
    console.error('渲染失败:', e);
    log('页面渲染异常: ' + e.message, 'err');
  }
}

function restartTimer() {
  if (timer) clearInterval(timer);
  timer = setInterval(poll, intervalMs);
  $('intervalTxt').textContent = (intervalMs / 1000) + ' 秒';
}

$('btnManual').onclick = () => { poll(); };
$('btnKey').onclick = promptKey;
$('modelSel').onchange = e => {
  modelIdx = +e.target.value;
  localStorage.setItem('duo_model_idx', String(modelIdx));
  const m = modelList[modelIdx];
  if (m) {
    applyTheme(m.name);  // 立即切换背景主题，不等 API 返回
    // 同步更新标题和按钮（数据等 API 返回后刷新）
    $('pageTitle').childNodes[0].textContent = '📱 ' + m.name + ' · 门店取货监控 ';
    $('buyLink').href = buyUrlFor(m.name);
    $('btnCopy').textContent = '📋 复制物料号 ' + m.part;
    document.title = m.name + ' · 京津门店库存监控';
    log(`已切换到 ${m.name}`);
  }
  poll();
};
$('intervalSel').onchange = e => { intervalMs = +e.target.value; restartTimer(); log(`刷新间隔已改为 ${intervalMs/1000} 秒`); };
$('btnClear').onclick = () => { $('log').innerHTML = ''; };
$('btnCopy').onclick = async () => {
  const m = modelList[modelIdx];
  const part = m ? m.part : 'MK2P4CH/A';
  await navigator.clipboard.writeText(part);
  log('已复制物料号 ' + part);
};
$('btnSound').onclick = async () => {
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  await audioCtx.resume();
  soundOn = !soundOn;
  $('btnSound').textContent = soundOn ? '🔕 关闭声音提醒' : '🔔 开启声音提醒';
  $('btnSound').classList.toggle('on', soundOn);
  if (soundOn) playRingtone();
  log(soundOn ? '声音提醒已开启' : '声音提醒已关闭');
};
$('btnNotify').onclick = async () => {
  if (!('Notification' in window)) { log('此浏览器不支持系统通知', 'err'); return; }
  const p = await Notification.requestPermission();
  log(p === 'granted' ? '系统通知已开启' : '系统通知权限被拒绝', p === 'granted' ? 'up' : 'err');
};

restartTimer();
updateKeyButton();
poll();
</script>
</body>
</html>
